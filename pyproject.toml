[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentence-breaker"
version = "0.1.0"
description = "Character-path sentence segmentation based on a persistent language graph."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "bigla" }
]
dependencies = []

[project.scripts]
sentence-breaker = "sentence_breaker.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
