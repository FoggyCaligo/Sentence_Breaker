name: Sentence_Breaker package license metadata

on:
  pull_request:
    paths:
      - 'LICENSE'
      - 'pyproject.toml'
      - 'README.md'
      - '.github/workflows/license-build.yml'
  push:
    branches: [dev]
    paths:
      - 'LICENSE'
      - 'pyproject.toml'
      - '.github/workflows/license-build.yml'

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel
      - name: Verify AGPL wheel metadata
        run: |
          python - <<'PY'
          import glob
          from pathlib import Path
          import zipfile

          wheel, = glob.glob('dist/*.whl')
          with zipfile.ZipFile(wheel) as archive:
              metadata_name, = [n for n in archive.namelist() if n.endswith('.dist-info/METADATA')]
              metadata = archive.read(metadata_name).decode('utf-8')
              assert 'License-Expression: AGPL-3.0-only' in metadata, metadata
          license_text = Path('LICENSE').read_text(encoding='utf-8')
          assert license_text.startswith('GNU AFFERO GENERAL PUBLIC LICENSE\nVersion 3'), 'Unexpected license text'
          PY
